name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Grant the permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This repository already contains a built static site at `static-web-builder/dist`.
      # Upload the folder as the Pages artifact and then deploy it to GitHub Pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: './static-web-builder/dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

