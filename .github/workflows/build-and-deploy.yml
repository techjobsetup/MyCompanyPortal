name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Grant the permissions required to deploy to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This repository already contains a built static site at `static-web-builder/dist`.
      # Upload the folder as the Pages artifact and then deploy it to GitHub Pages.
      - name: Deploy to GitHub Pages (push to gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: './static-web-builder/dist'

